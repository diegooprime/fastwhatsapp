app = "rand-whatsapp-bridge"
primary_region = "dfw"

[build]

[env]
  DATA_DIR = "/data"
  BIND_ADDR = "0.0.0.0:3847"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "wa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
